services:
  site:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PUBLIC_TOPRAK_PROJECT_SLUG: ${PUBLIC_TOPRAK_PROJECT_SLUG:-erdaltoprak}
        PUBLIC_TOPRAK_WRITE_KEY: ${PUBLIC_TOPRAK_WRITE_KEY:-ta_wk_replace_me}
    container_name: erdaltoprak-site
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
